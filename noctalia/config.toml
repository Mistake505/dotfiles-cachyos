config_version = 15

[bar]
order = [ "default", "windows", "islands", "islandsgroups", "defaultlayout", "sysmon" ]

    [bar.default]
    background_opacity = 0.54999998770654202
    border = "primary"
    border_width = 2.0
    center = [ "bar", "date", "clock", "eyecare-widget" ]
    end = [
        "media",
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "colorscheme_variants_widget",
        "session"
    ]
    start = [ "launcher", "wallpaper", "workspaces", "wallhaven", "active_window" ]

    [bar.defaultlayout]
    background_opacity = 0.79999998211860657
    capsule_radius = 0
    enabled = false
    margin_edge = 8
    radius = 0

    [bar.sysmon]
    background_opacity = 0.54999998770654202
    border = "primary"
    border_width = 2.0
    capsule_radius = 0
    center = [ "cat_3", "cpu", "ram", "temp", "network_rx", "network_tx" ]
    enabled = true
    end = []
    margin_edge = 8
    margin_ends = 380
    position = "left"
    radius = 0
    reserve_space = false
    scale = 1.2500000111758709
    smart_auto_hide = true
    start = []
    thickness = 100

    [bar.windows]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 64
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 0.54999998770654202
border = "primary"
border_width = 2.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1152.0
    output = "HDMI-A-1"
    placement_height = 1152.0
    placement_width = 2048.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.54999998770654202

[osd]
background_opacity = 0.54999998770654202

[plugin_settings."dotnetrob/cat"]
panel_placement = "floating"

[plugin_settings."noctalia/example"]
panel_open_near_click = true
panel_position = "auto"

[plugin_settings."noctalia/timer"]
panel_placement = "floating"

[plugin_settings."noctalia/wallhaven"]
browser_placement = "floating"
download_dir = "/home/ckjos/Pictures/Wallpapers/wallhaven"

[plugin_settings."nzlov/daily-wallpaper"]
panel_placement = "floating"

[plugin_settings."uozzoku/colorscheme_variants"]
panel_placement = "floating"

[plugins]
auto_update = "all"
enabled = [
    "ezequiel/mango_layouts",
    "dotnetrob/cat",
    "noctalia/wallhaven",
    "apex077/eyecare",
    "noctalia/timer",
    "whyoolw/dropwall",
    "uozzoku/colorscheme_variants",
    "nzlov/daily-wallpaper"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    enabled = false
    kind = "git"
    location = "https://github.com/Mistake505/noctalia-colorscheme-variants-plugin.git"
    name = "me-plugins"

    [[plugins.source]]
    kind = "path"
    location = "/home/ckjos/Projects/me-plugins"
    name = "me-plugins-local"

[shell]
font_family = "Maple Mono NF"

    [shell.launcher]
    app_grid = false
    search_position = "top"

    [shell.panel]
    border_color = "primary"
    border_width = 2.0
    launcher_position = "center"
    open_near_click_launcher = false
    transparency_mode = "glass"

[theme]
builtin = "Rosé Pine"
community_palette = "Catppuccin Mocha Lavender"
custom_palette = "custom"
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    community_ids = [
        "pywalfox",
        "zen-browser",
        "discord",
        "blender",
        "gimp",
        "inkscape",
        "vscode",
        "zed",
        "heroiclauncher",
        "prismlauncher",
        "steam",
        "vicinae",
        "fastfetch",
        "obs",
        "papirus-icons",
        "bat",
        "fzf",
        "lazygit",
        "yazi"
    ]

[wallpaper.default]
path = "/home/ckjos/Pictures/Wallpapers/cachyos-wallpapers/Cachy_Topography.jpg"

[wallpaper.last]
path = "/home/ckjos/Pictures/Wallpapers/cachyos-wallpapers/Cachy_Topography.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/ckjos/Pictures/Wallpapers/cachyos-wallpapers/Cachy_Topography.jpg"

[widget.bar]
