[backdrop]
enabled = true

[bar.default]
background_opacity = 0.79999998211860657
capsule_radius = 0
center = [ "cat_2", "date", "clock" ]
enabled = true
font_family = "Maple Mono NF"
margin_edge = 8
margin_ends = 8
radius = 0
start = [ "launcher", "wallpaper", "workspaces", "active_window" ]

[bar.islands]
background_opacity = 0.0
capsule = true
capsule_fill = "surface"
capsule_opacity = 0.79999998211860657
capsule_radius = 0
center = [ "cat", "date", "clock" ]
concave_edge_corners = false
enabled = false
font_family = "Maple Mono NF"
margin_ends = 0
radius = 0
start = [ "launcher", "wallpaper", "workspaces", "active_window" ]

[control_center]
sidebar_section = "none"

[dock]
background_opacity = 0.79999998211860657
enabled = true
launcher_custom_image = "/usr/share/icons/cachyos.svg"
launcher_custom_image_colorize = true
launcher_position = "start"
margin_edge = 8
pinned = [ "librewolf", "equibop", "org.gnome.Nautilus", "kitty", "vscodium", "com.shellyorg.shelly" ]
radius = 0
reserve_space = false
show_dots = true
smart_auto_hide = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.79999998211860657

[osd]
background_opacity = 0.79999998211860657

[plugins]
enabled = [ "dotnetrob/cat", "ezequiel/mango_layouts" ]

[shell]
corner_radius_scale = 0.0
font_family = "Maple Mono NF"
niri_overview_type_to_launch_enabled = true
polkit_agent = true
time_format = "{:%I:%M %p}"

    [shell.launcher]
    categories = false

        [shell.launcher.providers.session]
        global = true

        [shell.launcher.providers.windows]
        global = true

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    open_near_click_session = true
    session_placement = "floating"
    transparency_mode = "soft"
    wallpaper_placement = "floating"

    [shell.session]
    grid = true

[theme]
community_palette = "Catppuccin Mocha Lavender"
source = "community"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "cava", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "mango", "niri", "qt" ]
    community_ids = [
        "pywalfox",
        "discord",
        "blender",
        "gimp",
        "inkscape",
        "vscode",
        "heroiclauncher",
        "prismlauncher",
        "steam",
        "fastfetch",
        "obs",
        "papirus-icons",
        "bat",
        "lazygit"
    ]

[wallpaper.default]
path = "/home/ckjos/Pictures/Wallpapers/sel-walls_1/cabin-4.png"

[wallpaper.last]
path = "/home/ckjos/Pictures/Wallpapers/sel-walls_1/cabin-4.png"

[wallpaper.monitors.HDMI-A-1]
path = "/home/ckjos/Pictures/Wallpapers/sel-walls_1/cabin-4.png"

[widget.cat]
type = "dotnetrob/cat:cat"

[widget.cat_2]
type = "dotnetrob/cat:cat"

[widget.clock]
format = "{:%I:%M %p}"

[widget.launcher]
custom_image = "/usr/share/icons/cachyos.svg"
custom_image_colorize = true

[widget.workspaces]
show_labels = false
style = "regular"
