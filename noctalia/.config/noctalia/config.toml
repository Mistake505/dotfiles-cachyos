[widget.colorscheme_variants_widget_2]
type = "uozzoku/colorscheme_variants:colorscheme_variants_widget"

[widget.colorscheme_variants_widget_3]
type = "uozzoku/colorscheme_variants:colorscheme_variants_widget"

[widget.cpu]
visualization = "none"

[widget.eyecare-widget]
type = "apex077/eyecare:eyecare-widget"

[widget.eyecare_widget_2]
type = "apex077/eyecare:eyecare-widget"

[widget.launcher]
custom_image = "/usr/share/icons/cachyos.svg"
custom_image_colorize = true

[widget.network]
show_label = false

[widget.network_rx]
label_show_units = true
visualization = "none"

[widget.network_tx]
label_show_units = true
visualization = "none"

[widget.ram]
label_show_units = false
visualization = "none"

[widget.taskbar]
scale = 2.5

[widget.temp]
visualization = "none"

[widget.tray]
detached_panel = true
drawer = true

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.wallhaven_2]
type = "noctalia/wallhaven:wallhaven"

[widget.wallhaven_3]
type = "noctalia/wallhaven:wallhaven"

[widget.workspaces]
show_labels = false
