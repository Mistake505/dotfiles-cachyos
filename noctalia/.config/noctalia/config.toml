[backdrop]
enabled = true

[bar]
order = [ "default_with_system_stats", "default_without_system_stats", "system_stats_sidebar" ]

    [bar.default_without_system_stats]
    background_opacity = 0.79999998211860657
    border = "primary"
    border_width = 2.0
    capsule_radius = 0
    center = [ "cat_2", "clock", "date", "bar", "eyecare-widget" ]
    enabled = true
    margin_edge = 8
    margin_ends = 8
    radius = 0

    [bar.default_with_system_stats]
    background_opacity = 0.79999998211860657
    border = "primary"
    border_width = 2.0
    capsule_radius = 0
    center = [ "cat_2", "cpu", "ram", "temp", "network_rx", "network_tx" ]
    end = [
        "media",
        "clock",
        "date",
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "colorscheme_variants_widget",
        "session"
    ]
    margin_edge = 8
    margin_ends = 8
    radius = 0
    start = [ "launcher", "wallpaper", "wallhaven", "workspaces", "bar", "active_window", "eyecare-widget" ]

    [bar.system_stats_sidebar]
    background_opacity = 0.79999998211860657
    border = "primary"
    border_width = 2.0
    capsule_radius = 0
    center = [ "cat_3", "cpu", "ram", "temp", "network_rx", "network_tx" ]
    enabled = false
    end = []
    margin_edge = 8
    margin_ends = 380
    position = "right"
    radius = 0
    reserve_space = false
    scale = 1.25
    smart_auto_hide = false
    start = []
    thickness = 100

[control_center]
sidebar_section = "none"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 64
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 0.8
border = "primary"
border_width = 2.0
enabled = true
inactive_opacity = 0.85
launcher_custom_image = "/usr/share/icons/cachyos.svg"
launcher_custom_image_colorize = true
margin_edge = 8
pinned = [ "librewolf", "equibop", "kitty" ]
radius = 0
reserve_space = false
show_dots = true
smart_auto_hide = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1152.0
    output = "HDMI-A-1"
    placement_height = 1152.0
    placement_width = 2048.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.79999998211860657
border_color = "primary"
border_width = 2.0

[osd]
background_opacity = 0.79999998211860657
border_color = "primary"
border_width = 2.0

[plugin_settings."dotnetrob/cat"]
panel_placement = "floating"

[plugin_settings."noctalia/example"]
panel_open_near_click = true
panel_position = "auto"

[plugin_settings."noctalia/timer"]
panel_placement = "floating"

[plugin_settings."noctalia/wallhaven"]
browser_placement = "floating"
download_dir = "/home/ckjos/Pictures/Wallpapers/wallhaven"

[plugin_settings."nzlov/daily-wallpaper"]
panel_placement = "floating"

[plugin_settings."uozzoku/colorscheme_variants"]
panel_placement = "floating"

[plugins]
auto_update = "all"
enabled = [
    "ezequiel/mango_layouts",
    "dotnetrob/cat",
    "noctalia/wallhaven",
    "apex077/eyecare",
    "noctalia/timer",
    "whyoolw/dropwall",
    "uozzoku/colorscheme_variants",
    "nzlov/daily-wallpaper"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    enabled = false
    kind = "git"
    location = "https://github.com/Mistake505/noctalia-colorscheme-variants-plugin.git"
    name = "me-plugins"

    [[plugins.source]]
    kind = "path"
    location = "/home/ckjos/Projects/me-plugins"
    name = "me-plugins-local"

[shell]
avatar_path = "/home/ckjos/Desktop/images/Dropped Image.png"
corner_radius_scale = 0.0
font_family = "Maple Mono NF"
niri_overview_type_to_launch_enabled = true
polkit_agent = true

    [shell.launcher]
    categories = false
    pinned = [ "librewolf", "equibop", "kitty" ]
    search_position = "top"
    show_app_actions = true

        [shell.launcher.providers.panels]
        global = true

        [shell.launcher.providers.session]
        global = true

        [shell.launcher.providers.windows]
        global = true

    [shell.panel]
    border_color = "primary"
    border_width = 2.0
    control_center_placement = "floating"
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true
    session_placement = "floating"
    transparency_mode = "soft"
    wallpaper_placement = "floating"

    [shell.screen_corners]
    size = 1

    [shell.session]
    grid = true

[theme]
builtin = "Tokyo-Night"
community_palette = "Catppuccin Mocha Lavender"
